---
- name: Configure the media infrastructure
  hosts: nas:irc_bouncers
  become: true
  gather_facts: true

  vars:
    # Each service role is tagged with its selection key.
    selfhosted_selected: >-
      {{ (selfhosted_services | default({})) | dict2items
      | selectattr('value.enabled', 'defined') | selectattr('value.enabled', 'equalto', true)
      | map(attribute='key') | list }}

  pre_tasks:
    - name: Refuse a deployment in check mode
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: >-
          Deployment was started with --check, so no containers would be created.
          Use make check for validation and rerun the deployment without check mode.
      tags:
        - always

    - name: Validate the service selection
      ansible.builtin.assert:
        that:
          - (selfhosted_services | default({})) is mapping
          - >-
            (selfhosted_services | default({})) | dict2items | map(attribute='value')
            | map(attribute='enabled', default=false) | map('type_debug') | unique | difference(['bool'])
            | length == 0
        fail_msg: Set every selfhosted_services.<name>.enabled to true or false.
      tags:
        - always

  roles:
    - role: docker_runtime
      when: >-
        selfhosted_selected | length > 0
        and ('all' in ansible_run_tags or selfhosted_selected | intersect(ansible_run_tags) | length > 0)
      tags:
        - always

    - role: nas_tailscale
      when: "'tailscale' in selfhosted_selected"
      tags:
        - tailscale

    - role: caddy
      when: "'caddy' in selfhosted_selected"
      tags:
        - caddy

    - role: thelounge
      when: "'thelounge' in selfhosted_selected"
      tags:
        - thelounge

    - role: audiobookshelf
      when: "'audiobookshelf' in selfhosted_selected"
      tags:
        - audiobookshelf

    - role: qbittorrent
      when: "'qbittorrent' in selfhosted_selected"
      tags:
        - qbittorrent

    - role: znc
      when: "'znc' in selfhosted_selected"
      tags:
        - znc
