---
- name: Configure the media infrastructure
  hosts: nas:irc_bouncers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Refuse a deployment in check mode
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: >-
          Deployment was started with --check, so no containers would be created.
          Use make check for validation and rerun the deployment without check mode.
      tags:
        - always

  roles:
    - role: docker_runtime
      when: >-
        (('all' in ansible_run_tags or 'tailscale' in ansible_run_tags)
        and (selfhosted_services | default({})).get('tailscale', {}).get('enabled', false) | bool)
        or (('all' in ansible_run_tags or 'web_stack' in ansible_run_tags) and 'nas' in group_names and (
        (selfhosted_services | default({})).get('caddy', {}).get('enabled', false) | bool
        or (selfhosted_services | default({})).get('thelounge', {}).get('enabled', false) | bool))
        or (('all' in ansible_run_tags or 'znc' in ansible_run_tags)
        and (selfhosted_services | default({})).get('znc', {}).get('enabled', false) | bool)
      tags:
        - tailscale
        - web_stack
        - znc

    - role: nas_tailscale
      when: (selfhosted_services | default({})).get('tailscale', {}).get('enabled', false) | bool
      tags:
        - tailscale

    - role: web_stack
      when: >-
        'nas' in group_names and (
        (selfhosted_services | default({})).get('caddy', {}).get('enabled', false) | bool
        or (selfhosted_services | default({})).get('thelounge', {}).get('enabled', false) | bool)
      tags:
        - web_stack

    - role: znc
      when: (selfhosted_services | default({})).get('znc', {}).get('enabled', false) | bool
      tags:
        - znc
