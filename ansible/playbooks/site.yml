---
- name: Configure the media infrastructure
  hosts: nas:irc_bouncers
  become: true
  gather_facts: true

  vars:
    # Each service role is tagged with its name and selected by a boolean <name>_enabled.
    selfhosted_service_names: [tailscale, caddy, thelounge, audiobookshelf, qbittorrent, qui, autobrr, prowlarr, sonarr, radarr, pihole, znc]
    selfhosted_service_flags: >-
      {{ query('ansible.builtin.vars', *(selfhosted_service_names | map('regex_replace', '$', '_enabled')),
      default=false) }}
    selfhosted_selected: >-
      {{ selfhosted_service_names | zip(selfhosted_service_flags)
      | selectattr(1, 'equalto', true) | map(attribute=0) | list }}

  pre_tasks:
    - name: Refuse a deployment in check mode
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: >-
          Deployment was started with --check, so no containers would be created.
          Use make check for validation and rerun the deployment without check mode.
      tags:
        - always

    - name: Refuse the former selection map
      ansible.builtin.assert:
        that:
          - selfhosted_services is not defined
        fail_msg: >-
          selfhosted_services.<name>.enabled was replaced by flat <name>_enabled flags,
          for example caddy_enabled: true. Update the local group variables; see
          docs/getting-started.md#select-services.
      tags:
        - always

    - name: Validate the service selection
      ansible.builtin.assert:
        that:
          - selfhosted_service_flags | map('type_debug') | unique | difference(['bool']) | length == 0
        fail_msg: Set each <service>_enabled flag to true or false.
      tags:
        - always

  roles:
    - role: docker_runtime
      when: >-
        selfhosted_selected | length > 0
        and ('all' in ansible_run_tags or selfhosted_selected | intersect(ansible_run_tags) | length > 0)
      tags:
        - always

    - role: tailscale
      when: "'tailscale' in selfhosted_selected"
      tags:
        - tailscale

    - role: caddy
      when: "'caddy' in selfhosted_selected"
      tags:
        - caddy

    - role: thelounge
      when: "'thelounge' in selfhosted_selected"
      tags:
        - thelounge

    - role: audiobookshelf
      when: "'audiobookshelf' in selfhosted_selected"
      tags:
        - audiobookshelf

    - role: qbittorrent
      when: "'qbittorrent' in selfhosted_selected"
      tags:
        - qbittorrent

    - role: qui
      when: "'qui' in selfhosted_selected"
      tags:
        - qui

    - role: autobrr
      when: "'autobrr' in selfhosted_selected"
      tags:
        - autobrr

    - role: prowlarr
      when: "'prowlarr' in selfhosted_selected"
      tags:
        - prowlarr

    - role: sonarr
      when: "'sonarr' in selfhosted_selected"
      tags:
        - sonarr

    - role: radarr
      when: "'radarr' in selfhosted_selected"
      tags:
        - radarr

    # After every web service, so its local DNS records include their hostnames.
    - role: pihole
      when: "'pihole' in selfhosted_selected"
      tags:
        - pihole

    - role: znc
      when: "'znc' in selfhosted_selected"
      tags:
        - znc
