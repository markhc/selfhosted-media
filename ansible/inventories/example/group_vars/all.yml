---
selfhosted_services:
  tailscale:
    enabled: true
  caddy:
    enabled: true
  thelounge:
    enabled: true

# This becomes the NAS machine name in MagicDNS.
tailscale_hostname: media-nas

# Replace in the ignored local inventory with a domain you control.
thelounge_hostname: lounge.example.com

# Optional: also serve HTTPS on the NAS's fixed LAN IPv4 without client Tailscale.
# Leave empty for Tailscale-only access. Example placeholder: "192.168.50.10".
web_stack_lan_ip: ""
