---
# IANA timezone for service containers (log timestamps, schedules),
# e.g. "America/Sao_Paulo". 
# Override one service with <service>_timezone.
selfhosted_timezone: UTC

# Replace in the ignored local inventory with a domain you control.
thelounge_hostname: lounge.example.com
audiobookshelf_hostname: audiobooks.example.com
# Used only while qui is not selected; qui replaces the qBittorrent WebUI.
qbittorrent_hostname: torrents.example.com

# Optional: also serve HTTPS on the NAS's fixed LAN IPv4 without client Tailscale.
# Leave empty for Tailscale-only access. Example placeholder: "192.168.50.10".
caddy_lan_ip: ""
