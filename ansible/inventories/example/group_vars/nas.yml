---
# Each service is skipped unless its <service>_enabled flag is true. Keep a
# service's flag and settings together in its section below.
#
# Each section pins its container image. Change the tag to upgrade, and add
# <prefix>_image_digest to pin an exact image; see docs/operations.md#container-images.

# --- Shared by several services ---

# Shared media data root for qBittorrent and the services that import its downloads.
# It must already exist on one filesystem, holding for example torrents/ and media/;
# every such service sees it at selfhosted_data_container_path. See docs/media-stack.md.
selfhosted_data_path: ""
# selfhosted_data_path: /srv/data
# Path inside the containers; when migrating, use the one your old containers mount.
# selfhosted_data_container_path: /data
# Owner of the data tree; these services run as this UID/GID with a group-writable umask.
# selfhosted_data_uid: 1000
# selfhosted_data_gid: 1000
# selfhosted_data_umask: "002"

# --- Tailscale (docs/services/tailscale.md) ---
tailscale_enabled: true
tailscale_image_repository: tailscale/tailscale
tailscale_image_tag: "v1.104.2"
# This becomes the NAS machine name in MagicDNS.
tailscale_machine_name: media-nas

# --- Caddy (docs/services/caddy.md) ---
caddy_enabled: true
caddy_image_repository: caddy
# The Caddy release; also the tag of its official builder and base images.
caddy_version: "2.11.7"
caddy_cloudflare_version: "v0.2.4"
# Optional: also serve HTTPS on the NAS's fixed LAN IPv4 without client Tailscale.
# Leave empty for Tailscale-only access. Example placeholder: "192.168.50.10".
caddy_lan_ip: ""

# --- The Lounge (docs/services/thelounge.md) ---
thelounge_enabled: true
thelounge_image_repository: ghcr.io/thelounge/thelounge
thelounge_image_tag: "4.5.2"

# --- Audiobookshelf (docs/services/audiobookshelf.md) ---
audiobookshelf_enabled: true
audiobookshelf_image_repository: ghcr.io/advplyr/audiobookshelf
audiobookshelf_image_tag: "2.37.2"
# Audiobookshelf media folders. Each existing NAS directory appears inside the
# container at /media/<name>; add libraries in the web UI using those paths.
# Libraries are read-only unless read_only is false (podcast downloads, uploads).
audiobookshelf_libraries: []
# audiobookshelf_libraries:
#   - name: audiobooks
#     path: /srv/media/audiobooks
#   - name: podcasts
#     path: /srv/media/podcasts
#     read_only: false

# --- qBittorrent (docs/services/qbittorrent.md) ---
qbittorrent_enabled: false
qbittorrent_image_repository: qbittorrentofficial/qbittorrent-nox
qbittorrent_image_tag: "5.2.4-1"
# Set to true after reading qBittorrent's legal notice in docs/services/qbittorrent.md.
qbittorrent_confirm_legal_notice: false
# Each media service listens on its own loopback address; see docs/media-stack.md.
# qbittorrent_address: 127.10.0.1
# qbittorrent_webui_port: 8080
# It is recommended you change the torrenting port from the default 6881 to avoid ISP throttling.
# qbittorrent_torrenting_port: 6881
# Additional existing NAS directories, mounted read-only unless read_only is false.
qbittorrent_mounts: []
# qbittorrent_mounts:
#   - path: /srv/watch
#     target: /watch
#     read_only: false

# --- qui (docs/services/qui.md); the web UI for qBittorrent ---
qui_enabled: false
qui_image_repository: ghcr.io/autobrr/qui
qui_image_tag: "v1.33.1"
# qui_address: 127.10.0.2
# qui_port: 7476
# qui sees the shared data root and qbittorrent_mounts at the same paths as qBittorrent.
# qui_mounts: []

# --- autobrr (docs/services/autobrr.md); real-time download automation ---
autobrr_enabled: false
autobrr_image_repository: ghcr.io/autobrr/autobrr
autobrr_image_tag: "v1.89.0"
autobrr_hostname: autobrr.example.com
# autobrr_address: 127.10.0.4
# autobrr_port: 7474

# --- Prowlarr (docs/services/prowlarr.md); indexer manager for Sonarr and Radarr ---
# Requires prowlarr_api_key in the vault.
prowlarr_enabled: false
prowlarr_image_repository: ghcr.io/hotio/prowlarr
prowlarr_image_tag: "release-2.6.5.5623"
# prowlarr_address: 127.10.0.3

# --- Sonarr (docs/services/sonarr.md); one Compose project and Caddy site per instance ---
sonarr_enabled: false
sonarr_image_repository: ghcr.io/hotio/sonarr
sonarr_image_tag: "release-4.0.20.3014"
# Each instance needs a unique name, loopback address, and hostname, plus an API key
# under its name in the vaulted sonarr_api_keys. Removing an instance leaves it running.
sonarr_instances: []
# sonarr_instances:
#   - name: tv
#     address: 127.10.1.1
#     hostname: sonarr.example.com
#   - name: anime
#     address: 127.10.1.2
#     hostname: anime.example.com

# --- Radarr (docs/services/radarr.md); one Compose project and Caddy site per instance ---
radarr_enabled: false
radarr_image_repository: ghcr.io/hotio/radarr
radarr_image_tag: "release-6.4.4.10685"
# Each instance needs a unique name, loopback address, and hostname, plus an API key
# under its name in the vaulted radarr_api_keys. Removing an instance leaves it running.
radarr_instances: []
# radarr_instances:
#   - name: hd
#     address: 127.10.2.1
#     hostname: radarr.example.com
#   - name: uhd
#     address: 127.10.2.2
#     hostname: radarr-uhd.example.com

# --- Pi-hole (docs/services/pihole.md); LAN DNS that resolves every Caddy hostname ---
# Requires caddy_lan_ip, and pihole_webui_password in the vault.
pihole_enabled: false
pihole_image_repository: pihole/pihole
pihole_image_tag: "2026.10.0"
pihole_hostname: pihole.example.com
# pihole_upstreams:
#   - 1.1.1.1
#   - 1.0.0.1

# --- ZNC (docs/services/znc.md); runs on a separate bouncer host ---
znc_enabled: false
