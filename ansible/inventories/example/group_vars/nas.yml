---
selfhosted_services:
  tailscale:
    enabled: true
  caddy:
    enabled: true
  thelounge:
    enabled: true
  audiobookshelf:
    enabled: true
  qbittorrent:
    enabled: false
  znc:
    enabled: false

# This becomes the NAS machine name in MagicDNS.
tailscale_hostname: media-nas

# Audiobookshelf media folders. Each existing NAS directory appears inside the
# container at /media/<name>; add libraries in the web UI using those paths.
# Libraries are read-only unless read_only is false (podcast downloads, uploads).
audiobookshelf_libraries: []
# audiobookshelf_libraries:
#   - name: audiobooks
#     path: /srv/media/audiobooks
#   - name: podcasts
#     path: /srv/media/podcasts
#     read_only: false

# Shared media data root for qBittorrent and the services that import its downloads.
# It must already exist on one filesystem, holding for example torrents/ and media/;
# every such service sees it at /data. See docs/media-stack.md.
selfhosted_data_path: ""
# selfhosted_data_path: /srv/data
# Owner of the data tree; these services run as this UID/GID with a group-writable umask.
# selfhosted_data_uid: 1000
# selfhosted_data_gid: 1000
# selfhosted_data_umask: "002"

# Set to true after reading qBittorrent's legal notice in docs/services/qbittorrent.md.
qbittorrent_confirm_legal_notice: false
# Each media service listens on its own loopback address; see docs/media-stack.md.
# qbittorrent_address: 127.10.0.1
