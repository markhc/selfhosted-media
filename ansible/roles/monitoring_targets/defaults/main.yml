---
# Every monitoring component owns one loopback address. Components use host
# networking so they can communicate without a shared Docker network.
monitoring_targets_services:
  grafana: "{{ grafana_address | default('127.20.0.1') }}"
  prometheus: "{{ prometheus_address | default('127.20.0.2') }}"
  node_exporter: "{{ node_exporter_address | default('127.20.0.3') }}"
  cadvisor: "{{ cadvisor_address | default('127.20.0.4') }}"
  loki: "{{ loki_address | default('127.20.0.5') }}"
  alloy: "{{ alloy_address | default('127.20.0.6') }}"
monitoring_targets_names: "{{ monitoring_targets_services.keys() | list }}"
monitoring_targets_selected: >-
  {{ monitoring_targets_names
  | zip(query('ansible.builtin.vars', *(monitoring_targets_names | map('regex_replace', '$', '_enabled')),
  default=false))
  | selectattr(1, 'equalto', true) | map(attribute=0) | list }}
