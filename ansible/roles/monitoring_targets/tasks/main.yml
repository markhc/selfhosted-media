---
- name: Collect the selected monitoring targets
  ansible.builtin.set_fact:
    monitoring_targets_addresses: >-
      {{ monitoring_targets_services | dict2items
      | selectattr('key', 'in', monitoring_targets_selected) | items2dict }}

# 127.0.0.0/16 is reserved for conventional host listeners and system services.
- name: Validate the monitoring target addresses
  ansible.builtin.assert:
    that:
      - monitoring_targets_addresses.values() | select('string') | list | length == monitoring_targets_addresses | length
      - monitoring_targets_addresses.values() | reject('match', monitoring_targets_address_pattern) | list | length == 0
      - monitoring_targets_addresses.values() | unique | list | length == monitoring_targets_addresses | length
    fail_msg: >-
      Give every selected monitoring component a unique loopback address in
      127.0.0.0/8 outside 127.0.0.0/16, such as 127.20.0.1.
  vars:
    monitoring_targets_octet: (?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])
    monitoring_targets_address_pattern: >-
      ^127\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?)\.{{ monitoring_targets_octet }}\.{{ monitoring_targets_octet }}$

- name: Resolve the selected media service addresses
  ansible.builtin.include_role:
    name: media_hosts

- name: Keep monitoring and media service addresses distinct
  ansible.builtin.assert:
    that:
      - monitoring_targets_addresses.values()
        | intersect(media_hosts_addresses.values()) | length == 0
    fail_msg: >-
      A monitoring component and a selected media service use the same loopback
      address. Give every service on this host a unique address.
