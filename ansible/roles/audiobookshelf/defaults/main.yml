---
audiobookshelf_directory: /opt/selfhosted/audiobookshelf
audiobookshelf_image_repository: ghcr.io/advplyr/audiobookshelf
audiobookshelf_image_tag: "2.37.2"
# Optional sha256 digest that pins the exact image, e.g. sha256:<64 hex digits>.
audiobookshelf_image_digest: ""
audiobookshelf_port: 13378
# Container TZ; defaults to the shared selfhosted_timezone, else UTC.
audiobookshelf_timezone: "{{ selfhosted_timezone | default('UTC') }}"
# The container user must be able to read (and, for writable libraries, write) the media.
audiobookshelf_uid: 1000
audiobookshelf_gid: 1000
# Each entry bind-mounts an existing host directory at /media/<name> in the container.
audiobookshelf_libraries: []
