---
- name: Create the deployment directory for {{ radarr_instance_name }}
  ansible.builtin.file:
    path: "{{ radarr_instance_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

# Never recursive: migrated configuration keeps the ownership the operator set.
- name: Create the configuration directory for {{ radarr_instance_name }}
  ansible.builtin.file:
    path: "{{ radarr_instance_directory }}/config"
    state: directory
    owner: "{{ radarr_uid }}"
    group: "{{ radarr_gid }}"
    mode: '0700'

- name: Write the API key for {{ radarr_instance_name }}
  ansible.builtin.copy:
    content: "RADARR__AUTH__APIKEY={{ radarr_api_keys[radarr_instance.name] }}\n"
    dest: "{{ radarr_instance_directory }}/api.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  register: radarr_api_key_file

- name: Write the Compose project for {{ radarr_instance_name }}
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ radarr_instance_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0600'

- name: Converge {{ radarr_instance_name }}
  community.docker.docker_compose_v2:
    project_src: "{{ radarr_instance_directory }}"
    project_name: selfhosted-{{ radarr_instance_name }}
    state: present
    recreate: "{{ 'always' if radarr_api_key_file is changed else 'auto' }}"
    remove_orphans: true
    wait: true
    wait_timeout: 180
  when: not ansible_check_mode
  no_log: true

- name: Publish the Caddy site for {{ radarr_instance_name }}
  ansible.builtin.include_role:
    name: caddy
    tasks_from: site
  vars:
    caddy_site_name: "{{ radarr_instance_name }}"
    caddy_site_hostname: "{{ radarr_instance.hostname }}"
    caddy_site_upstream: "{{ radarr_instance.address }}:{{ radarr_port }}"
  when: not ansible_check_mode
