---
# Each instance is deployed to <root>/radarr-<name>.
radarr_deployment_root: /opt/selfhosted
radarr_image_repository: ghcr.io/hotio/radarr
radarr_image_tag: "release-6.4.4.10685"
# Optional sha256 digest that pins the exact image, e.g. sha256:<64 hex digits>.
radarr_image_digest: ""
# Every instance listens on this port at its own loopback address.
radarr_port: 7878
# info, debug, or trace.
radarr_log_level: info
# Container TZ; defaults to the shared selfhosted_timezone, else UTC.
radarr_timezone: "{{ selfhosted_timezone | default('UTC') }}"
# Radarr imports from the shared media data root at the same container path as qBittorrent.
radarr_data_path: "{{ selfhosted_data_path | default('') }}"
radarr_data_container_path: "{{ selfhosted_data_container_path | default('/data') }}"
radarr_uid: "{{ selfhosted_data_uid | default(1000) }}"
radarr_gid: "{{ selfhosted_data_gid | default(1000) }}"
radarr_umask: "{{ selfhosted_data_umask | default('002') }}"
# Each instance needs a name, a loopback address, and a hostname, plus an API key in the
# vaulted radarr_api_keys map under the same name.
radarr_instances: []
