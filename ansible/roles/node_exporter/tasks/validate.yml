---
- name: Resolve the monitoring target addresses
  ansible.builtin.include_role:
    name: monitoring_targets

- name: Validate the node_exporter configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - node_exporter_directory is match('^/[a-zA-Z0-9/_-]+$')
      - node_exporter_port | int > 1024
      - node_exporter_port | int < 65536
      - node_exporter_image is string
    fail_msg: >-
      node_exporter requires Debian/Ubuntu, an absolute deployment path, an
      unprivileged port, a unique monitoring address, and a pinned image.
