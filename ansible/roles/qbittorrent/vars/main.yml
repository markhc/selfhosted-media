---
# Image reference from the repository, tag, and optional digest in defaults/main.yml.
qbittorrent_image: >-
  {{ qbittorrent_image_repository
  | container_image(qbittorrent_image_tag, qbittorrent_image_digest) }}

# The WebUI binds to the loopback address that the media_hosts role assigns.
qbittorrent_webui_address: "{{ media_hosts_addresses.qbittorrent }}"

qbittorrent_conf_path: "{{ qbittorrent_directory }}/config/qBittorrent/config/qBittorrent.conf"

# qBittorrent 5.3 moved the WebUI settings from [Preferences] WebUI\* keys to a [WebUI]
# section. Settings are enforced where the pinned version reads them and removed from the other.
qbittorrent_webui_locations:
  - section: WebUI
    prefix: ""
  - section: Preferences
    prefix: WebUI\
qbittorrent_legacy_webui: "{{ qbittorrent_image_tag is version('5.3', '<') }}"
qbittorrent_webui_location: "{{ qbittorrent_webui_locations[1 if qbittorrent_legacy_webui | bool else 0] }}"
qbittorrent_webui_stale_location: "{{ qbittorrent_webui_locations[0 if qbittorrent_legacy_webui | bool else 1] }}"

# qui is the web UI when selected on the same host; otherwise Caddy publishes the WebUI.
qbittorrent_published: "{{ not (qui_enabled | default(false) | bool) }}"

# WebUI settings enforced on every deployment. Local and subnet authentication bypasses
# stay off because Caddy and qui reach the WebUI from loopback.
qbittorrent_webui_settings:
  - option: Address
    value: "{{ qbittorrent_webui_address }}"
  - option: Port
    value: "{{ qbittorrent_webui_port }}"
  - option: LocalHostAuth
    value: "true"
  - option: AuthSubnetWhitelistEnabled
    value: "false"
  - option: ReverseProxySupportEnabled
    value: "true"
  - option: TrustedReverseProxiesList
    value: 127.0.0.1
  - option: Username
    value: "{{ qbittorrent_webui_username }}"
  - option: Password_PBKDF2
    value: >-
      "{{ qbittorrent_webui_password
      | qbittorrent_pbkdf2(inventory_hostname ~ ':' ~ qbittorrent_webui_username) }}"
