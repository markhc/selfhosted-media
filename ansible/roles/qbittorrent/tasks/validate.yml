---
- name: Resolve the media service addresses
  ansible.builtin.include_role:
    name: media_hosts

- name: Validate the qBittorrent configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - qbittorrent_confirm_legal_notice is boolean
      - qbittorrent_confirm_legal_notice
      - qbittorrent_directory is match('^/[a-zA-Z0-9/_-]+$')
      - qbittorrent_webui_port | int > 1024
      - qbittorrent_webui_port | int < 65536
      - qbittorrent_torrenting_port | int > 1024
      - qbittorrent_torrenting_port | int < 65536
      - qbittorrent_webui_port | int != qbittorrent_torrenting_port | int
      - qbittorrent_uid | int > 0
      - qbittorrent_gid | int > 0
      - qbittorrent_umask is string
      - qbittorrent_umask is match('^0?[0-7]{3}$')
      - qbittorrent_timezone is string
      - qbittorrent_timezone is match('^[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)*$')
    fail_msg: >-
      qBittorrent requires Debian/Ubuntu, qbittorrent_confirm_legal_notice set to true,
      an absolute deployment path, two different unprivileged ports, a non-root UID/GID,
      a quoted octal umask such as "002", and an IANA timezone name.

- name: Validate the shared data paths for qBittorrent
  ansible.builtin.assert:
    that:
      - qbittorrent_data_path is string
      # Absolute, without a trailing slash, empty, '.', or '..' components.
      - qbittorrent_data_path is match('^(?:/[^/\x00-\x1f\x7f]+)+$')
      - (qbittorrent_data_path ~ '/') is not search('/\.\.?/')
      # Never expose another service's deployment data, such as Caddy's token.
      - not ((qbittorrent_directory | dirname) ~ '/').startswith(qbittorrent_data_path ~ '/')
      - not qbittorrent_data_path.startswith((qbittorrent_directory | dirname) ~ '/')
      - qbittorrent_data_container_path is string
      - qbittorrent_data_container_path is match('^(?:/[A-Za-z0-9._-]+)+$')
      - (qbittorrent_data_container_path ~ '/') is not search('/\.\.?/')
      # Never shadow the image's system directories, its /config volume, or its /tmp tmpfs.
      - qbittorrent_data_container_path is not
        match('^/(?:bin|boot|config|dev|etc|lib|lib32|lib64|libx32|proc|run|sbin|sys|tmp|usr)(?:/|$)')
    fail_msg: >-
      Set selfhosted_data_path to the existing media data root, an absolute host path
      outside {{ qbittorrent_directory | dirname }}, and selfhosted_data_container_path
      to an absolute container path such as /data, outside system directories, /config, and /tmp.

- name: Validate the qBittorrent mount list
  ansible.builtin.assert:
    that:
      - qbittorrent_mounts is sequence
      - qbittorrent_mounts is not string
      - qbittorrent_mounts is not mapping
    fail_msg: Set qbittorrent_mounts to a list of mounts.

- name: Validate each qBittorrent mount
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.path is defined and item.path is string
      # Absolute, without a trailing slash, empty, '.', or '..' components.
      - item.path is match('^(?:/[^/\x00-\x1f\x7f]+)+$')
      - (item.path ~ '/') is not search('/\.\.?/')
      # Never expose another service's deployment data, such as Caddy's token.
      - not ((qbittorrent_directory | dirname) ~ '/').startswith(item.path ~ '/')
      - not item.path.startswith((qbittorrent_directory | dirname) ~ '/')
      - item.target is defined and item.target is string
      - item.target is match('^(?:/[A-Za-z0-9._-]+)+$')
      - (item.target ~ '/') is not search('/\.\.?/')
      - item.target is not
        match('^/(?:bin|boot|config|dev|etc|lib|lib32|lib64|libx32|proc|run|sbin|sys|tmp|usr)(?:/|$)')
      # Neither the shared data root nor another mount may sit at or below this target,
      # and this target may not sit below the shared data root.
      - qbittorrent_mount_targets | select('match', (item.target | regex_escape) ~ '(?:/|$)') | list | length == 1
      - not (item.target ~ '/').startswith(qbittorrent_data_container_path ~ '/')
      - item.read_only | default(true) is boolean
    fail_msg: >-
      Each qBittorrent mount needs an absolute host path outside
      {{ qbittorrent_directory | dirname }}, an absolute container target outside system
      directories, /config, /tmp, the shared data path, and the other mounts, and an
      optional boolean read_only.
  loop: "{{ qbittorrent_mounts }}"
  loop_control:
    label: "{{ item.target | default('unnamed') if item is mapping else 'invalid' }}"
  vars:
    qbittorrent_mount_targets: >-
      {{ [qbittorrent_data_container_path]
      + (qbittorrent_mounts | select('mapping') | map(attribute='target', default='') | select('string') | list) }}

- name: Validate the qBittorrent WebUI credentials
  ansible.builtin.assert:
    that:
      - qbittorrent_webui_username is defined
      - qbittorrent_webui_username is string
      - qbittorrent_webui_username is match('^[A-Za-z0-9._-]{1,64}$')
      - qbittorrent_webui_password is defined
      - qbittorrent_webui_password is string
      - qbittorrent_webui_password | length >= 8
      - qbittorrent_webui_password is not search('[\x00-\x1f\x7f]')
    fail_msg: >-
      Set qbittorrent_webui_username (letters, digits, '.', '_', or '-') and a
      qbittorrent_webui_password of at least 8 characters in the encrypted vault.

- name: Validate the qBittorrent WebUI publication
  ansible.builtin.assert:
    that:
      - caddy_enabled | default(false) | bool
      - qbittorrent_hostname is defined
      - qbittorrent_hostname is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
    fail_msg: >-
      The qBittorrent WebUI is published through Caddy, also as a fallback next to qui:
      enable Caddy and set qbittorrent_hostname in a DNS zone you control.

- name: Validate the qBittorrent container image
  ansible.builtin.assert:
    that:
      - qbittorrent_image is string
    quiet: true

# The tag decides where the WebUI settings are enforced, so it must name a release.
- name: Validate the qBittorrent release
  ansible.builtin.assert:
    that:
      - qbittorrent_image_tag is match('^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9]+)?$')
      - qbittorrent_image_tag is version('5.0', '>=')
    fail_msg: >-
      Set qbittorrent_image_tag to an official qbittorrent-nox release tag of 5.0 or
      newer, such as "5.2.4-1".
