---
# Loopback address of each single-instance media service; override one with
# <service>_address. Sonarr and Radarr instances set an address per instance in
# <app>_instances instead.
media_hosts_services:
  qbittorrent: "{{ qbittorrent_address | default('127.10.0.1') }}"
  qui: "{{ qui_address | default('127.10.0.2') }}"
  prowlarr: "{{ prowlarr_address | default('127.10.0.3') }}"
  autobrr: "{{ autobrr_address | default('127.10.0.4') }}"
  plex: "{{ plex_address | default('127.10.0.5') }}"
media_hosts_instance_services:
  - sonarr
  - radarr

# Services selected on this host by their <service>_enabled flags.
media_hosts_candidates: "{{ media_hosts_services.keys() | list + media_hosts_instance_services }}"
media_hosts_selected: >-
  {{ media_hosts_candidates
  | zip(query('ansible.builtin.vars', *(media_hosts_candidates | map('regex_replace', '$', '_enabled')),
  default=false))
  | selectattr(1, 'equalto', true) | map(attribute=0) | list }}
