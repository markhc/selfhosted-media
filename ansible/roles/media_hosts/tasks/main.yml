---
# Sets media_hosts_addresses, the name and loopback address of every media
# service and instance selected on this host, for example sonarr-anime. Media
# roles other than qBittorrent and Plex render it as extra_hosts so they reach their
# peers by name on the applications' default ports.
- name: Validate the media service instance lists
  ansible.builtin.assert:
    that:
      - lookup('vars', item ~ '_instances', default=[]) is sequence
      - lookup('vars', item ~ '_instances', default=[]) is not string
      - lookup('vars', item ~ '_instances', default=[]) is not mapping
      - lookup('vars', item ~ '_instances', default=[]) | select('mapping') | list | length
        == lookup('vars', item ~ '_instances', default=[]) | length
      - lookup('vars', item ~ '_instances', default=[]) | map(attribute='name', default='')
        | select('match', '^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$') | unique | list | length
        == lookup('vars', item ~ '_instances', default=[]) | length
      - lookup('vars', item ~ '_instances', default=[]) | selectattr('address', 'defined') | list | length
        == lookup('vars', item ~ '_instances', default=[]) | length
    fail_msg: >-
      Set {{ item }}_instances to a list of instances, each with a unique lowercase
      name (letters, digits, and '-') and a loopback address.
  loop: "{{ media_hosts_instance_services | select('in', media_hosts_selected) | list }}"

- name: Collect the selected single-instance media services
  ansible.builtin.set_fact:
    media_hosts_addresses: >-
      {{ media_hosts_services | dict2items | selectattr('key', 'in', media_hosts_selected) | items2dict }}

- name: Collect the selected media service instances
  ansible.builtin.set_fact:
    media_hosts_addresses: >-
      {{ media_hosts_addresses | combine(dict(
      lookup('vars', item ~ '_instances', default=[]) | map(attribute='name') | map('regex_replace', '^', item ~ '-')
      | zip(lookup('vars', item ~ '_instances', default=[]) | map(attribute='address')))) }}
  loop: "{{ media_hosts_instance_services | select('in', media_hosts_selected) | list }}"

# 127.0.0.0/16 holds 127.0.0.1, systemd-resolved's 127.0.0.53, and Debian's 127.0.1.1 hostname.
- name: Validate the media service addresses
  ansible.builtin.assert:
    that:
      - media_hosts_addresses.values() | select('string') | list | length == media_hosts_addresses | length
      - media_hosts_addresses.values() | reject('match', media_hosts_address_pattern) | list | length == 0
      - media_hosts_addresses.values() | unique | list | length == media_hosts_addresses | length
    fail_msg: >-
      Give every media service and instance a unique loopback address in 127.0.0.0/8
      outside 127.0.0.0/16, such as 127.10.1.1.
  vars:
    media_hosts_octet: (?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])
    media_hosts_address_pattern: >-
      ^127\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?)\.{{ media_hosts_octet }}\.{{ media_hosts_octet }}$
