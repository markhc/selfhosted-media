---
- name: Validate the autobrr configuration
  ansible.builtin.import_tasks: validate.yml

- name: Create the autobrr deployment directory
  ansible.builtin.file:
    path: "{{ autobrr_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

# Never recursive: migrated configuration keeps the ownership the operator set.
- name: Create the autobrr configuration directory
  ansible.builtin.file:
    path: "{{ autobrr_directory }}/config"
    state: directory
    owner: "{{ autobrr_uid }}"
    group: "{{ autobrr_gid }}"
    mode: '0700'

- name: Write the autobrr Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ autobrr_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0600'

- name: Converge autobrr
  community.docker.docker_compose_v2:
    project_src: "{{ autobrr_directory }}"
    project_name: selfhosted-autobrr
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 120
  when: not ansible_check_mode

- name: Publish autobrr through Caddy
  ansible.builtin.include_role:
    name: caddy
    tasks_from: site
  vars:
    caddy_site_name: autobrr
    caddy_site_hostname: "{{ autobrr_hostname }}"
    caddy_site_upstream: "autobrr:{{ autobrr_port }}"
  when: not ansible_check_mode
