---
- name: Resolve the media service addresses
  ansible.builtin.include_role:
    name: media_hosts

- name: Validate the qui configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - caddy_enabled | default(false) | bool
      - qui_directory is match('^/[a-zA-Z0-9/_-]+$')
      - qui_hostname is defined
      - qui_hostname is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - qui_port | int > 1024
      - qui_port | int < 65536
      - qui_log_level in ['ERROR', 'WARN', 'INFO', 'DEBUG', 'TRACE']
      - qui_uid | int > 0
      - qui_gid | int > 0
      - qui_umask is string
      - qui_umask is match('^0?[0-7]{3}$')
      - qui_timezone is string
      - qui_timezone is match('^[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)*$')
    fail_msg: >-
      qui requires Debian/Ubuntu, Caddy, an absolute deployment path, qui_hostname in a
      DNS zone you control, an unprivileged port, an uppercase log level such as INFO,
      a non-root UID/GID, a quoted octal umask such as "002", and an IANA timezone name.

- name: Validate the shared data paths for qui
  ansible.builtin.assert:
    that:
      - qui_data_path is string
      # Absolute, without a trailing slash, empty, '.', or '..' components.
      - qui_data_path is match('^(?:/[^/\x00-\x1f\x7f]+)+$')
      - (qui_data_path ~ '/') is not search('/\.\.?/')
      # Never expose another service's deployment data, such as Caddy's token.
      - not ((qui_directory | dirname) ~ '/').startswith(qui_data_path ~ '/')
      - not qui_data_path.startswith((qui_directory | dirname) ~ '/')
      - qui_data_container_path is string
      - qui_data_container_path is match('^(?:/[A-Za-z0-9._-]+)+$')
      - (qui_data_container_path ~ '/') is not search('/\.\.?/')
      # Never shadow the image's system directories, its /config volume, or its /tmp tmpfs.
      - qui_data_container_path is not
        match('^/(?:bin|boot|config|dev|etc|lib|lib32|lib64|libx32|proc|run|sbin|sys|tmp|usr)(?:/|$)')
    fail_msg: >-
      Set selfhosted_data_path to the existing media data root, an absolute host path
      outside {{ qui_directory | dirname }}, and selfhosted_data_container_path
      to an absolute container path such as /data, outside system directories, /config, and /tmp.

- name: Validate the qui mount list
  ansible.builtin.assert:
    that:
      - qui_mounts is sequence
      - qui_mounts is not string
      - qui_mounts is not mapping
    fail_msg: Set qui_mounts (by default qbittorrent_mounts) to a list of mounts.

- name: Validate each qui mount
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.path is defined and item.path is string
      # Absolute, without a trailing slash, empty, '.', or '..' components.
      - item.path is match('^(?:/[^/\x00-\x1f\x7f]+)+$')
      - (item.path ~ '/') is not search('/\.\.?/')
      # Never expose another service's deployment data, such as Caddy's token.
      - not ((qui_directory | dirname) ~ '/').startswith(item.path ~ '/')
      - not item.path.startswith((qui_directory | dirname) ~ '/')
      - item.target is defined and item.target is string
      - item.target is match('^(?:/[A-Za-z0-9._-]+)+$')
      - (item.target ~ '/') is not search('/\.\.?/')
      - item.target is not
        match('^/(?:bin|boot|config|dev|etc|lib|lib32|lib64|libx32|proc|run|sbin|sys|tmp|usr)(?:/|$)')
      # Neither the shared data root nor another mount may sit at or below this target,
      # and this target may not sit below the shared data root.
      - qui_mount_targets | select('match', (item.target | regex_escape) ~ '(?:/|$)') | list | length == 1
      - not (item.target ~ '/').startswith(qui_data_container_path ~ '/')
      - item.read_only | default(true) is boolean
    fail_msg: >-
      Each qui mount needs an absolute host path outside
      {{ qui_directory | dirname }}, an absolute container target outside system
      directories, /config, /tmp, the shared data path, and the other mounts, and an
      optional boolean read_only.
  loop: "{{ qui_mounts }}"
  loop_control:
    label: "{{ item.target | default('unnamed') if item is mapping else 'invalid' }}"
  vars:
    qui_mount_targets: >-
      {{ [qui_data_container_path]
      + (qui_mounts | select('mapping') | map(attribute='target', default='') | select('string') | list) }}

- name: Validate the qui container image
  ansible.builtin.assert:
    that:
      - qui_image is string
    quiet: true
