---
# Publishes a service on the shared Docker network through Caddy. Callers set caddy_site_name,
# caddy_site_hostname, and caddy_site_upstream.
- name: Validate the Caddy site for {{ caddy_site_name }}
  ansible.builtin.assert:
    that:
      - caddy_site_name is match('^[a-z0-9][a-z0-9_-]{0,63}$')
      - caddy_site_hostname is string
      - caddy_site_hostname is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - caddy_site_upstream is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?:[0-9]{1,5}$')
      - caddy_site_upstream | split(':') | last | int > 0
      - caddy_site_upstream | split(':') | last | int < 65536
    fail_msg: >-
      A Caddy site needs a lowercase name, a DNS hostname in a zone you control,
      and a Docker DNS upstream such as audiobookshelf:13378 or sonarr-tv:8989.

- name: Check that Caddy is deployed for {{ caddy_site_name }}
  ansible.builtin.stat:
    path: "{{ caddy_directory }}/compose.yml"
  register: caddy_site_deployment

- name: Require a deployed Caddy for {{ caddy_site_name }}
  ansible.builtin.assert:
    that:
      - caddy_site_deployment.stat.exists
    fail_msg: Deploy Caddy (make deploy-caddy) before publishing {{ caddy_site_name }}.

- name: Write the Caddy site for {{ caddy_site_name }}
  ansible.builtin.template:
    src: site.caddy.j2
    dest: "{{ caddy_directory }}/conf/sites/{{ caddy_site_name }}.caddy"
    owner: root
    group: root
    mode: '0644'

- name: Apply the Caddy site for {{ caddy_site_name }}
  ansible.builtin.import_tasks: reload.yml
