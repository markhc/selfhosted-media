---
- name: Validate the Caddy host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - caddy_directory is match('^/[a-zA-Z0-9/_-]+$')
      - caddy_timezone is string
      - caddy_timezone is match('^[A-Za-z][A-Za-z0-9_+-]*(?:/[A-Za-z0-9_+-]+)*$')
    fail_msg: Caddy requires Debian/Ubuntu, an absolute deployment path, and an IANA timezone name.

- name: Reject variables from the former combined web stack
  ansible.builtin.assert:
    that:
      - web_stack_cloudflare_api_token is not defined
      - web_stack_lan_ip is not defined
    fail_msg: >-
      Rename web_stack_cloudflare_api_token to caddy_cloudflare_api_token (vault)
      and web_stack_lan_ip to caddy_lan_ip (inventory); see the migration steps in
      docs/operations.md.
  no_log: true

- name: Validate the optional LAN listener
  ansible.builtin.assert:
    that:
      - caddy_lan_ip is string
      - >-
        caddy_lan_ip == '' or (
          caddy_lan_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
          and caddy_lan_ip is match('^(?:10\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|192\.168\.)')
          and (caddy_lan_ip.split('.') | map('int') | max) <= 255
          and (caddy_lan_ip.split('.') | map('int') | map('string') | join('.')) == caddy_lan_ip
        )
    fail_msg: >-
      Set caddy_lan_ip to an empty string (Tailscale only) or a quoted
      RFC1918 IPv4 address assigned to the host's LAN interface.

- name: Require the Cloudflare DNS token
  ansible.builtin.assert:
    that:
      - caddy_cloudflare_api_token is match('^[A-Za-z0-9_-]+$')
    fail_msg: Set caddy_cloudflare_api_token in the Ansible Vault to a scoped Cloudflare API token.
  no_log: true
