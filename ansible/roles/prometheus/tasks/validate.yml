---
- name: Resolve the monitoring target addresses
  ansible.builtin.include_role:
    name: monitoring_targets

- name: Validate the Prometheus configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - prometheus_directory is match('^/[a-zA-Z0-9/_-]+$')
      - prometheus_port | int > 1024
      - prometheus_port | int < 65536
      - prometheus_scrape_interval is match('^[1-9][0-9]*[smh]$')
      - prometheus_retention_time is match('^[1-9][0-9]*[dhmy]$')
      - prometheus_retention_size is match('^[1-9][0-9]*(?:MB|GB|TB)$')
      - prometheus_image is string
    fail_msg: >-
      Prometheus requires Debian/Ubuntu, an absolute deployment path, an
      unprivileged port, valid scrape and retention limits, and a pinned image.
