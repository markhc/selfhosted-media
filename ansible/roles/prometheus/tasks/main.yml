---
- name: Validate the Prometheus configuration
  ansible.builtin.import_tasks: validate.yml

- name: Create the Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ prometheus_directory }}", owner: root, group: root, mode: '0700'}
    - {path: "{{ prometheus_directory }}/data", owner: '65534', group: '65534', mode: '0700'}

- name: Write the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_directory }}/prometheus.yml"
    owner: root
    group: root
    mode: '0644'
  register: prometheus_configuration

- name: Write the Prometheus Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ prometheus_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0600'

- name: Converge Prometheus
  community.docker.docker_compose_v2:
    project_src: "{{ prometheus_directory }}"
    project_name: selfhosted-prometheus
    state: present
    recreate: "{{ 'always' if prometheus_configuration is changed else 'auto' }}"
    remove_orphans: true
    wait: true
    wait_timeout: 120
  when: not ansible_check_mode
