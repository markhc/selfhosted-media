---
- name: Validate the cAdvisor configuration
  ansible.builtin.import_tasks: validate.yml

- name: Create the cAdvisor deployment directory
  ansible.builtin.file:
    path: "{{ cadvisor_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write the cAdvisor Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ cadvisor_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0600'

- name: Converge cAdvisor
  community.docker.docker_compose_v2:
    project_src: "{{ cadvisor_directory }}"
    project_name: selfhosted-cadvisor
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 120
  when: not ansible_check_mode
