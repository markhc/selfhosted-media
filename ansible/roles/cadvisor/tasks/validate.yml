---
- name: Resolve the monitoring target addresses
  ansible.builtin.include_role:
    name: monitoring_targets

- name: Validate the cAdvisor configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - cadvisor_directory is match('^/[a-zA-Z0-9/_-]+$')
      - cadvisor_port | int > 1024
      - cadvisor_port | int < 65536
      - cadvisor_housekeeping_interval is match('^[1-9][0-9]*[smh]$')
      - cadvisor_image is string
    fail_msg: >-
      cAdvisor requires Debian/Ubuntu, an absolute deployment path, an
      unprivileged port, a duration such as 30s, and a pinned image.
