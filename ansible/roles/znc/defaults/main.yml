---
znc_directory: /opt/selfhosted/znc
znc_image_repository: znc
znc_image_tag: "1.10.3-slim"
# Optional sha256 digest that pins the exact image, e.g. sha256:<64 hex digits>.
znc_image_digest: ""
znc_uid: 10000
znc_gid: 10000
znc_port: 6697
znc_memory_limit: 128m
# Container TZ; defaults to the shared selfhosted_timezone, else UTC.
znc_timezone: "{{ selfhosted_timezone | default('UTC') }}"
znc_buffer_size: 1000
znc_max_query_buffers: 50

# Opt in to Let's Encrypt DNS-01 with cloudflare; self_signed needs no DNS API.
znc_tls_mode: self_signed
# Required in cloudflare mode; optional additional DNS SAN in self_signed mode.
znc_tls_hostname: ""
znc_tls_certificate_days: 365
znc_tls_renew_before_days: 30

# Cloudflare mode only. Enabling it accepts the Let's Encrypt subscriber terms.
znc_acme_image_repository: certbot/dns-cloudflare
znc_acme_image_tag: "v5.8.0"
# Optional sha256 digest that pins the exact image, e.g. sha256:<64 hex digits>.
znc_acme_image_digest: ""
znc_acme_email: ""
znc_acme_dns_propagation_seconds: 60

# Host-specific confidential inputs belong in the encrypted controller vault.
znc_users: "{{ (znc_instances | default({})).get(inventory_hostname, {}).get('users', []) }}"
znc_savebuff_password: "{{ (znc_instances | default({})).get(inventory_hostname, {}).get('savebuff_password', '') }}"
znc_cloudflare_api_token: "{{ (znc_instances | default({})).get(inventory_hostname, {}).get('cloudflare_api_token', '') }}"
