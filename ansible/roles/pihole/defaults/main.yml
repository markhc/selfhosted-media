---
pihole_directory: /opt/selfhosted/pihole
pihole_image_repository: pihole/pihole
pihole_image_tag: "2026.10.0"
# Optional sha256 digest that pins the exact image, e.g. sha256:<64 hex digits>.
pihole_image_digest: ""
# Internal port of the web interface behind Caddy.
pihole_port: 8053
# The fixed private LAN IPv4 that answers DNS; defaults to Caddy's LAN listener.
pihole_dns_address: "{{ caddy_lan_ip | default('') }}"
# Upstream resolvers: IP addresses, each with an optional #port.
pihole_upstreams:
  - 1.1.1.1
  - 1.0.0.1
# Container TZ; defaults to the shared selfhosted_timezone, else UTC.
pihole_timezone: "{{ selfhosted_timezone | default('UTC') }}"
# Owner of the Pi-hole data; the DNS server runs as this non-root user.
pihole_uid: 1000
pihole_gid: 1000
pihole_webui_password: ""
