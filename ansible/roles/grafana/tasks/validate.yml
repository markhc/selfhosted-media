---
- name: Resolve the monitoring target addresses
  ansible.builtin.include_role:
    name: monitoring_targets

- name: Validate the Grafana configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - caddy_enabled | default(false) | bool
      - grafana_directory is match('^/[a-zA-Z0-9/_-]+$')
      - grafana_hostname is defined
      - grafana_hostname is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - grafana_port | int > 1024
      - grafana_port | int < 65536
      - grafana_uid | int > 0
      - grafana_gid | int > 0
      - grafana_admin_user is match('^[A-Za-z0-9_.@-]{1,64}$')
      - grafana_node_exporter_full_revision | int > 0
      - grafana_node_exporter_full_url is match('^https://grafana\.com/api/dashboards/1860/revisions/[1-9][0-9]*/download$')
      - grafana_node_exporter_full_checksum is match('^sha256:[a-f0-9]{64}$')
      - grafana_image is string
    fail_msg: >-
      Grafana requires Debian/Ubuntu, Caddy, an absolute deployment path, a
      valid HTTPS hostname, an unprivileged port and UID/GID, an admin user,
      a unique monitoring address, a pinned node_exporter dashboard, and a pinned image.

- name: Require the Grafana administrator password
  ansible.builtin.assert:
    that:
      - grafana_admin_password is defined
      - grafana_admin_password is string
      - grafana_admin_password | length >= 8
      - grafana_admin_password is not search('[\x00-\x1f\x7f]')
    fail_msg: >-
      Set grafana_admin_password in the encrypted vault to a password of at
      least 8 characters without control characters.
  no_log: true
