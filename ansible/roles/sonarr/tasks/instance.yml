---
- name: Create the deployment directory for {{ sonarr_instance_name }}
  ansible.builtin.file:
    path: "{{ sonarr_instance_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

# Never recursive: migrated configuration keeps the ownership the operator set.
- name: Create the configuration directory for {{ sonarr_instance_name }}
  ansible.builtin.file:
    path: "{{ sonarr_instance_directory }}/config"
    state: directory
    owner: "{{ sonarr_uid }}"
    group: "{{ sonarr_gid }}"
    mode: '0700'

- name: Write the API key for {{ sonarr_instance_name }}
  ansible.builtin.copy:
    content: "SONARR__AUTH__APIKEY={{ sonarr_api_keys[sonarr_instance.name] }}\n"
    dest: "{{ sonarr_instance_directory }}/api.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  register: sonarr_api_key_file

- name: Write the Compose project for {{ sonarr_instance_name }}
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ sonarr_instance_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0600'

- name: Converge {{ sonarr_instance_name }}
  community.docker.docker_compose_v2:
    project_src: "{{ sonarr_instance_directory }}"
    project_name: selfhosted-{{ sonarr_instance_name }}
    state: present
    recreate: "{{ 'always' if sonarr_api_key_file is changed else 'auto' }}"
    remove_orphans: true
    wait: true
    wait_timeout: 180
  when: not ansible_check_mode
  no_log: true

- name: Publish the Caddy site for {{ sonarr_instance_name }}
  ansible.builtin.include_role:
    name: caddy
    tasks_from: site
  vars:
    caddy_site_name: "{{ sonarr_instance_name }}"
    caddy_site_hostname: "{{ sonarr_instance.hostname }}"
    caddy_site_upstream: "{{ sonarr_instance_name }}:{{ sonarr_port }}"
  when: not ansible_check_mode
