---
# Each instance is deployed to <root>/sonarr-<name>.
sonarr_deployment_root: /opt/selfhosted
sonarr_image_repository: ghcr.io/hotio/sonarr
sonarr_image_tag: "release-4.0.20.3014"
# Optional sha256 digest that pins the exact image, e.g. sha256:<64 hex digits>.
sonarr_image_digest: ""
# Every instance listens on this port at its own loopback address.
sonarr_port: 8989
# info, debug, or trace.
sonarr_log_level: info
# Container TZ; defaults to the shared selfhosted_timezone, else UTC.
sonarr_timezone: "{{ selfhosted_timezone | default('UTC') }}"
# Sonarr imports from the shared media data root at the same container path as qBittorrent.
sonarr_data_path: "{{ selfhosted_data_path | default('') }}"
sonarr_data_container_path: "{{ selfhosted_data_container_path | default('/data') }}"
sonarr_uid: "{{ selfhosted_data_uid | default(1000) }}"
sonarr_gid: "{{ selfhosted_data_gid | default(1000) }}"
sonarr_umask: "{{ selfhosted_data_umask | default('002') }}"
# Each instance needs a name, a loopback address, and a hostname, plus an API key in the
# vaulted sonarr_api_keys map under the same name.
sonarr_instances: []
