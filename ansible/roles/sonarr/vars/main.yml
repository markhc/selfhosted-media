---
# Image reference from the repository, tag, and optional digest in defaults/main.yml.
sonarr_image: >-
  {{ sonarr_image_repository
  | container_image(sonarr_image_tag, sonarr_image_digest) }}

# Per-instance values; tasks/instance.yml sets sonarr_instance for each entry of sonarr_instances.
sonarr_instance_name: sonarr-{{ sonarr_instance.name }}
sonarr_instance_directory: "{{ sonarr_deployment_root }}/{{ sonarr_instance_name }}"

# Host headers Sonarr accepts besides its built-in localhost names: Caddy passes the
# public hostname, and media services connect by name or address.
sonarr_allowed_hosts:
  - "{{ sonarr_instance.hostname }}"
  - "{{ sonarr_instance_name }}"
  - "{{ sonarr_instance.address }}"
