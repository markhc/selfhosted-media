---
web_stack_directory: /opt/selfhosted/web
# Optional additional HTTPS listener; set to the NAS's fixed private LAN IPv4.
web_stack_lan_ip: ""
web_stack_caddy_enabled: "{{ (selfhosted_services | default({})).get('caddy', {}).get('enabled', false) | bool }}"
web_stack_thelounge_enabled: "{{ (selfhosted_services | default({})).get('thelounge', {}).get('enabled', false) | bool }}"
web_stack_caddy_version: 2.11.7
web_stack_cloudflare_version: v0.2.4
web_stack_cloudflare_api_token: ""
web_stack_thelounge_image: ghcr.io/thelounge/thelounge:4.5.2
web_stack_thelounge_port: 9000
web_stack_acme_ca: https://acme-v02.api.letsencrypt.org/directory
