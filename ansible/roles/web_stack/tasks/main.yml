---
- name: Validate web stack dependencies
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
      - not web_stack_thelounge_enabled or web_stack_caddy_enabled
      - web_stack_directory is match('^/[a-zA-Z0-9/_-]+$')
      - web_stack_thelounge_port | int > 1024
      - web_stack_thelounge_port | int < 65536
    fail_msg: The Lounge requires Caddy; the web stack requires Debian/Ubuntu and an absolute deployment path.

- name: Validate the optional LAN listener
  ansible.builtin.assert:
    that:
      - web_stack_lan_ip is string
      - >-
        web_stack_lan_ip == '' or (
          web_stack_lan_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
          and web_stack_lan_ip is match('^(?:10\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|192\.168\.)')
          and (web_stack_lan_ip.split('.') | map('int') | max) <= 255
          and (web_stack_lan_ip.split('.') | map('int') | map('string') | join('.')) == web_stack_lan_ip
        )
    fail_msg: >-
      Set web_stack_lan_ip to an empty string (Tailscale only) or a quoted
      RFC1918 IPv4 address assigned to the NAS's LAN interface.

- name: Validate The Lounge hostname
  ansible.builtin.assert:
    that:
      - thelounge_hostname is defined
      - thelounge_hostname is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
    fail_msg: Set thelounge_hostname to a DNS hostname in a zone you control.
  when: web_stack_thelounge_enabled

- name: Require the Cloudflare DNS token
  ansible.builtin.assert:
    that:
      - web_stack_cloudflare_api_token is match('^[A-Za-z0-9_-]+$')
    fail_msg: Set web_stack_cloudflare_api_token in the Ansible Vault to a scoped Cloudflare API token.
  when: web_stack_caddy_enabled
  no_log: true

- name: Discover the NAS Tailscale IPv4 address
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ nas_tailscale_directory | default('/opt/selfhosted/tailscale') }}"
      - --project-name
      - selfhosted-tailscale
      - exec
      - -T
      - tailscale
      - tailscale
      - ip
      - -4
  register: web_stack_tailscale_ip
  changed_when: false
  check_mode: false

- name: Require an enrolled NAS
  ansible.builtin.assert:
    that:
      - web_stack_tailscale_ip.stdout | trim is match('^100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$')
    fail_msg: Enroll the NAS into Tailscale before deploying the web stack.

- name: Create the deployment directory
  ansible.builtin.file:
    path: "{{ web_stack_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ web_stack_directory }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - caddy
    - caddy/data
    - caddy/config
  when: web_stack_caddy_enabled

- name: Create The Lounge data directory
  ansible.builtin.file:
    path: "{{ web_stack_directory }}/thelounge"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0700'
  when: web_stack_thelounge_enabled

- name: Write the Caddy build definition
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ web_stack_directory }}/caddy/Dockerfile"
    owner: root
    group: root
    mode: '0644'
  register: web_stack_caddy_build
  when: web_stack_caddy_enabled

- name: Exclude Caddy runtime data and secrets from the build context
  ansible.builtin.copy:
    src: caddy.dockerignore
    dest: "{{ web_stack_directory }}/caddy/.dockerignore"
    owner: root
    group: root
    mode: '0644'
  when: web_stack_caddy_enabled

- name: Write the Caddy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ web_stack_directory }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: '0644'
  register: web_stack_caddy_config
  when: web_stack_caddy_enabled

- name: Write the Cloudflare token on the NAS
  ansible.builtin.copy:
    content: "CLOUDFLARE_API_TOKEN={{ web_stack_cloudflare_api_token }}\n"
    dest: "{{ web_stack_directory }}/caddy/cloudflare.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  register: web_stack_cloudflare_token
  when: web_stack_caddy_enabled

- name: Write The Lounge configuration
  ansible.builtin.template:
    src: lounge-config.js.j2
    dest: "{{ web_stack_directory }}/thelounge/config.js"
    owner: '1000'
    group: '1000'
    mode: '0600'
  register: web_stack_lounge_config
  when: web_stack_thelounge_enabled

- name: Write the Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ web_stack_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0600'

- name: Converge the selected web services
  community.docker.docker_compose_v2:
    project_src: "{{ web_stack_directory }}"
    project_name: selfhosted-web
    state: present
    build: "{{ 'always' if web_stack_caddy_build is changed else 'policy' }}"
    recreate: >-
      {{ 'always' if (web_stack_caddy_config is changed or web_stack_lounge_config is changed
      or web_stack_cloudflare_token is changed) else 'auto' }}
    remove_orphans: true
    wait: true
    wait_timeout: 120
  when: not ansible_check_mode
  no_log: true
